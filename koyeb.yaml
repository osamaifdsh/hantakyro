name: hantakyro
services:
  - name: web
    type: web
    git:
      repository: github.com/osamaifdsh/hantakyro
      branch: main
    instance_types:
      - type: free
    regions:
      - fra
    scaling:
      min: 1
      max: 1
    ports:
      - port: 10000
        protocol: http
    routes:
      - path: /
        port: 10000
    health_checks:
      - port: 10000
        protocol: http
        path: /api/health
        interval: 60
        timeout: 10
        healthy_threshold: 2
        unhealthy_threshold: 3
    env:
      - key: PORT
        value: "10000"
      - key: DASHBOARD_ENABLED
        value: "true"
